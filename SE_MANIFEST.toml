# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.2"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-operational-identity"
class = "theory"
kind = "foundation"
status = "active"
since = "2026"
summary = "Formalizes declared and implementation-induced identity relations, their comparison, faithfulness, divergence witnesses, and conditional structural positioning."

# === Layer Position ===

[layer]
space = "formal-theory"
role = "theory"

# === Dependency Declarations ===

[depends]
required = [
  { repository = "se-theory-persistence", kind = "semantic" },
]
optional = []

# === Provided Artifacts ===

[provides]
# Logical artifacts exposed by this repository.
# These are stable identifiers, not file paths.
artifacts = [
  "lean-library",
  "theorem-set",
  "operational-treatment-definitions",
  "declared-operational-comparison-definitions",
  "faithfulness-definitions",
  "divergence-witness-definitions",
  "surface-composition-definitions",
  "conditional-structural-positioning",
  "finite-audit-verdict-definitions",
]

# === Scope ===

[scope]
includes = [
  "declared identity relations supplied under explicit assumptions",
  "implementation mechanisms and identity-relevant treatment signatures",
  "operational equivalence relations induced by examined treatment",
  "faithfulness as inclusion of declared identity in operational equivalence",
  "finite divergence witnesses and their relationship to faithfulness",
  "composition of identity-relevant implementation surfaces",
  "conditional structural positioning relative to alternative identity relations",
  "distinction between local alignment and global regime substitution",
  "finite decidability under explicit assumptions",
  "three-valued audit outcomes: pass, fail, and indeterminate",
  "limits of conformance claims under incomplete implementation disclosure",
  "machine-checked Lean definitions and theorems",
]

excludes = [
  "foundational persistence relations and identity-commitment calculus",
  "neutral substrate primitives and referential foundations",
  "foundational transformation operators and effect semantics",
  "individuation and co-reference criteria",
  "identity-regime inventories and transformation-classification matrices",
  "scientific validation of declared identity criteria",
  "inference of referent identity from equal implementation behavior",
  "certification of complete implementation disclosure or observation",
  "domain-specific identity commitments and mappings",
  "empirical conformance studies and vulnerability-matching evaluations",
  "runtime auditing systems and operational implementations",
  "repository governance rules and external schema definitions",
]

# === Validation ===

[validation]
# Validates repository declaration, manifest schema conformance,
# reference artifacts, generated artifacts, and Lean public surface coverage.
export_check_entrypoint = "uvx se-theory-reference-kit@latest export --check"
reference_entrypoint = "uvx se-theory-reference-kit@latest validate"
strict_entrypoint = "uvx se-theory-reference-kit@latest validate --strict"

# === Behavior / governance ===

[naming]
pattern = "se-theory-*"

[governance]
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"
preferred = "CITATION.cff"

[traceability]
identifier_map = "reference/theory-reference.toml"
