# ============================================================
# reference/theory-reference.toml
# ============================================================
# Theory reference configuration.
#
# WHY: The theory repository owns Lean source, reference TOML,
# and exported JSON artifacts.
# The reusable kit owns validation, export, catalog, scaffold,
# and inspection machinery.

schema = "se-theory-reference"
schema_version = "0.1.0"

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "se-theory-operational-identity"
theory = "operational-identity"
description = "Operational identity theory repository for Structural Explainability."

# === Lean Public Surface ===

[lean]
root_module = "SE"

public_modules = [
    "SE",
    "SE.OperationalIdentity",
    "SE.OperationalIdentity.Composition",
    "SE.OperationalIdentity.Declared",
    "SE.OperationalIdentity.Faithfulness",
    "SE.OperationalIdentity.Finite",
    "SE.OperationalIdentity.Licensed",
    "SE.OperationalIdentity.Position",
    "SE.OperationalIdentity.Surface",
    "SE.OperationalIdentity.Verdict",
]

test_modules = ["SETest"]

# === Reference Artifacts ===

[reference]
root = "reference"

# === Exported Machine Artifacts ===

[export]
root = "data/operational-identity"

# === Surface-Kind Mapping ===
#
# Operational identity has no axioms or requirements, so those kinds
# are not registered.

[surface_kinds]
type = "reference/operational-identity-types.toml"
vocabulary = "reference/operational-identity-vocabulary.toml"
predicate = "reference/operational-identity-predicates.toml"
theorem = "reference/operational-identity-theorems.toml"
dependency = "reference/dependency-registry.toml"
traceability = "reference/traceability-registry.toml"

# === Export Mapping ===
#
# Every JSON artifact below is generated; do not hand-edit data/operational-identity.

[export_map]
catalog = "data/operational-identity/operational-identity-catalog.json"
type = "data/operational-identity/operational-identity-type-registry.json"
vocabulary = "data/operational-identity/operational-identity-vocabulary-registry.json"
predicate = "data/operational-identity/operational-identity-predicate-registry.json"
theorem = "data/operational-identity/operational-identity-theorem-registry.json"
dependency = "data/operational-identity/dependency-registry.json"
traceability = "data/operational-identity/traceability-registry.json"
